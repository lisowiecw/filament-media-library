name: Update Changelog

# The release notes are written on the release and copied back into the
# changelog afterwards, so the file on main and the notes on the tag cannot
# drift. main takes changes through a pull request, so this opens one rather
# than pushing: a bypass would have to cover every workflow in the repository
# to buy one commit a fortnight.
on:
  release:
    types: [released]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      - name: Open a pull request with the updated changelog
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: changelog/${{ github.event.release.name }}
          delete-branch: true
          add-paths: CHANGELOG.md
          commit-message: Date the release the notes were written for
          title: "Changelog: ${{ github.event.release.name }}"
          body: |
            The notes published on [${{ github.event.release.name }}](${{ github.event.release.html_url }})
            move out of Unreleased into a dated section, and the compare links follow.

            Opened by `update-changelog.yml`, which cannot push to main because
            main takes changes through a pull request. Merging this is the last
            step of the release.
