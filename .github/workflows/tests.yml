name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]
        laravel: [13.*]
        filament: [4.*, 5.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          # One leg installs the floor of every declared constraint, so an
          # under-declared lower bound fails here rather than in an install.
          - php: 8.3
            laravel: 13.*
            testbench: 11.*
            filament: 5.*
            stability: prefer-lowest

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - F${{ matrix.filament }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, gd, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "filament/filament:${{ matrix.filament }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      # Serially, because the type coverage plugin forks a worker per file and
      # they all write one cache file: two writes landing together leave it
      # half written, and the next run dies parsing it. Pinning the fork pool
      # to one process (the plugin's memory budget is what sizes it) is the
      # only lever the plugin gives, and this tree is small enough to afford.
      - name: Type Coverage
        env:
          FORK_MEM_PER_PROC: 1099511627776
        run: composer test:types

      - name: Test Suite
        run: composer test:unit

  # The browser suite drives a real Chromium against the workbench, so it runs
  # once rather than across the matrix: what it proves is that the panel works,
  # which is a fact about the package rather than about a version pair. One
  # Filament major is enough, and it is the one the workbench is built for.
  browser:
    name: browser
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, gd, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare
          npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The suite opens the workbench panel, so the workbench has to exist and
      # Filament's own assets have to be published for it.
      - name: Build the workbench
        run: |
          composer build
          vendor/bin/testbench filament:assets

      # pipefail, because the log is teed: without it the pipeline reports
      # tee's exit code and a suite with failures in it goes green.
      - name: Browser Suite
        run: |
          set -o pipefail
          composer test:browser 2>&1 | tee browser-tests.log

      # What a failure leaves behind: the screenshot the runner saves for the
      # test that failed, and the run's own output, which carries the console
      # messages the page logged.
      - name: Failure artefacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: |
            tests/Browser/Screenshots/
            browser-tests.log
          if-no-files-found: ignore
          retention-days: 7

  # One stable name for branch protection and the release guard to require,
  # since every matrix leg is named after the versions it ran. A leg that fails,
  # or is cancelled by fail-fast before it reports, leaves this red, so a red
  # Filament 4 job blocks a release rather than sitting under a check nobody
  # pinned. The browser suite is part of what this name covers: it runs once
  # rather than across the matrix, but a panel that no longer works in a browser
  # is not a release, and a check nothing requires is a check nothing blocks.
  matrix-result:
    name: matrix
    needs: [tests, browser]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Every leg of the matrix passed
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "The compatibility matrix did not pass: ${{ needs.tests.result }}."
            exit 1
          fi

          if [ "${{ needs.browser.result }}" != "success" ]; then
            echo "The browser suite did not pass: ${{ needs.browser.result }}."
            exit 1
          fi
